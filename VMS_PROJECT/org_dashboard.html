<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organization Dashboard</title>
  <style>
    :root {
      --bg-deep: #0f172a;
      --bg-soft: #1f2937;
      --panel: #111827;
      --panel-light: #1e293b;
      --accent: #2563eb;
      --accent-soft: #60a5fa;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.2);
      --success: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Candara", "Optima", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top, #1f2937, #0f172a 55%);
      min-height: 100vh;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 24px;
      background: linear-gradient(120deg, rgba(249, 115, 22, 0.12), rgba(148, 163, 184, 0.05));
      border-radius: 20px;
      border: 1px solid var(--line);
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(140deg, var(--accent), #fde68a);
      color: #111827;
      display: grid;
      place-items: center;
      font-weight: 700;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0;
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
      font-size: 24px;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .auth {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-label {
      font-weight: 600;
      color: var(--accent-soft);
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 8px 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: var(--accent);
      color: #111827;
      box-shadow: 0 12px 20px rgba(249, 115, 22, 0.35);
    }

    .btn-secondary {
      background: #334155;
      color: var(--ink);
    }

    .btn-outline {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }

    .btn-ghost {
      background: transparent;
      color: var(--accent-soft);
      border-color: transparent;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-edit {
      background: rgba(249, 115, 22, 0.2);
      color: var(--accent-soft);
      border-color: rgba(249, 115, 22, 0.4);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.5);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin: 24px 0;
    }

    .stat-card {
      background: var(--panel);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--line);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.4);
    }

    .stat-card h3 {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
    }

    .panel {
      background: var(--panel-light);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
    }

    .panel-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
    }

    .tab-btn.active {
      background: rgba(249, 115, 22, 0.15);
      color: var(--accent-soft);
      border-color: rgba(249, 115, 22, 0.4);
    }

    .panel-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-content {
      display: none;
      padding-top: 20px;
    }

    .tab-content.active {
      display: block;
    }

    .search-row {
      margin-bottom: 16px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0f172a;
      color: var(--ink);
      font-size: 14px;
    }

    textarea { min-height: 100px; resize: vertical; }

    .list-grid {
      display: grid;
      gap: 12px;
    }

    .employee-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .employee-avatar {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .dept-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .department-item {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .dept-name {
      font-weight: 700;
      color: var(--accent-soft);
    }

    .dept-count {
      background: rgba(148, 163, 184, 0.15);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
    }

    .analytics-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .panel-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }

    .chart-item {
      background: rgba(15, 23, 42, 0.7);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 8px;
      background: rgba(148, 163, 184, 0.2);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(120deg, var(--accent), #fde68a);
    }

    .org-chart {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .chart-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .chart-box h3 { margin: 0 0 8px; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 1000;
    }

    .modal-content {
      background: var(--panel);
      border-radius: 20px;
      border: 1px solid var(--line);
      padding: 24px;
      max-width: 480px;
      width: 100%;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    label {
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      .top-bar { flex-direction: column; align-items: flex-start; }
      .panel-actions { width: 100%; }
      .panel-actions .btn { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <div class="brand">
        <div class="brand-mark">ORG</div>
        <div>
          <h1>Organization Dashboard</h1>
          <p>People, departments, and structure at a glance.</p>
        </div>
      </div>
      <div class="auth">
        <span id="userLabel" class="user-label"></span>
        <button id="loginBtn" class="btn btn-outline" onclick="openLoginModal()">Login</button>
        <button id="logoutBtn" class="btn btn-ghost" onclick="logout()" style="display: none;">Logout</button>
      </div>
    </header>

    <section class="stats-grid">
      <div class="stat-card">
        <h3>Total Employees</h3>
        <div id="totalEmployees" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <h3>Total Departments</h3>
        <div id="totalDepts" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <h3>Average Team Size</h3>
        <div id="avgTeamSize" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <h3>Occupancy Rate</h3>
        <div id="occupancyRate" class="stat-value">0%</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab(event, 'employeesTab')">Employees</button>
          <button class="tab-btn" onclick="switchTab(event, 'departmentsTab')">Departments</button>
          <button class="tab-btn" onclick="switchTab(event, 'analyticsTab')">Insights</button>
          <button class="tab-btn" onclick="switchTab(event, 'orgChartTab')">Org Chart</button>
        </div>
        <div class="panel-actions">
          <button class="btn btn-primary" onclick="openAddEmployeeModal()">Add Employee</button>
          <button class="btn btn-secondary" onclick="openAddDeptModal()">Add Department</button>
        </div>
      </div>

      <div id="employeesTab" class="tab-content active">
        <div class="search-row">
          <input id="searchBox" type="text" placeholder="Search employees, roles, or departments" />
        </div>
        <div id="employeesList" class="list-grid"></div>
      </div>

      <div id="departmentsTab" class="tab-content">
        <ul id="departmentsList" class="dept-list"></ul>
      </div>

      <div id="analyticsTab" class="tab-content">
        <div class="analytics-grid">
          <div class="panel-card">
            <h3>Recent Employees</h3>
            <div id="recentEmployeesList"></div>
          </div>
          <div class="panel-card">
            <h3>Department Capacity</h3>
            <div id="deptDistribution"></div>
          </div>
        </div>
      </div>

      <div id="orgChartTab" class="tab-content">
        <div id="orgChartContainer" class="org-chart"></div>
      </div>
    </section>
  </div>

  <div id="addEmployeeModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="employeeModalTitle">Add New Employee</h2>
        <button class="btn btn-outline" onclick="closeAddEmployeeModal()">Close</button>
      </div>
      <form id="employeeForm" class="form-grid">
        <div>
          <label for="empName">Full name</label>
          <input id="empName" type="text" required />
        </div>
        <div>
          <label for="empEmail">Email</label>
          <input id="empEmail" type="email" required />
        </div>
        <div>
          <label for="empDept">Department</label>
          <select id="empDept" required></select>
        </div>
        <div>
          <label for="empPosition">Position</label>
          <input id="empPosition" type="text" required />
        </div>
        <div>
          <label for="empPhone">Phone</label>
          <input id="empPhone" type="text" />
        </div>
        <div class="modal-actions">
          <button type="submit" id="employeeSubmitBtn" class="btn btn-primary">Add Employee</button>
        </div>
      </form>
    </div>
  </div>

  <div id="addDeptModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="deptModalTitle">Add New Department</h2>
        <button class="btn btn-outline" onclick="closeAddDeptModal()">Close</button>
      </div>
      <form id="departmentForm" class="form-grid">
        <div>
          <label for="deptName">Department name</label>
          <input id="deptName" type="text" required />
        </div>
        <div>
          <label for="deptHead">Department head</label>
          <input id="deptHead" type="text" required />
        </div>
        <div>
          <label for="deptBudget">Annual budget</label>
          <input id="deptBudget" type="number" min="0" required />
        </div>
        <div>
          <label for="deptDesc">Description</label>
          <textarea id="deptDesc" required></textarea>
        </div>
        <div class="modal-actions">
          <button type="submit" id="deptSubmitBtn" class="btn btn-primary">Add Department</button>
        </div>
      </form>
    </div>
  </div>

  <div id="loginModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Sign In</h2>
        <button class="btn btn-outline" onclick="closeLoginModal()">Close</button>
      </div>
      <form id="loginForm" class="form-grid">
        <div>
          <label for="loginUsername">Username</label>
          <input id="loginUsername" type="text" required />
        </div>
        <div>
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" required />
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
      </form>
    </div>
  </div>

  <script src="org_dashboard.js"></script>
</body>
</html>
