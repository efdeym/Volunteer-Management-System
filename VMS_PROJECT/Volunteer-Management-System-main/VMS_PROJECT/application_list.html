<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Application Review</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="application_list.css">
</head>
<body>

<div class="container dashboard-panel">
    <h2> Application Review Dashboard </h2>

    <?php 
    if (!empty($page_message)) {
        echo '<div class="alert success">' . htmlspecialchars($page_message) . '</div>';
    }
    if (!empty($error_message)) {
        echo '<div class="alert danger">' . htmlspecialchars($error_message) . '</div>';
    }
    ?>

    <?php if (empty($applications)): ?>
        <p>No applications currently awaiting review or listed in the system.</p>
    <?php else: ?>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Project</th>
                        <th>Volunteer</th>
                        <th>Applied On</th>
                        <th>Current Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <?php foreach ($applications as $app): ?>
                    <tr>
                        <td><?php echo $app['application_id']; ?></td>
                        <td><?php echo htmlspecialchars($app['project_title']); ?></td>
                        <td><?php echo htmlspecialchars($app['first_name'] . ' ' . $app['last_name']); ?></td>
                        <td><?php echo date('Y-m-d', strtotime($app['application_date'])); ?></td>
                        <td>
                            <span class="status-pill status-<?php echo strtolower($app['status']); ?>">
                                <?php echo htmlspecialchars($app['status']); ?>
                            </span>
                        </td>
                        <td>
                            <?php if ($app['status'] === 'Pending'): ?>
                                
                                <form method="POST" action="application_list.php" class="inline-form">
                                    <input type="hidden" name="update_status" value="1">
                                    <input type="hidden" name="application_id" value="<?php echo $app['application_id']; ?>">
                                    <input type="hidden" name="status" value="Approved">
                                    <button type="submit" class="btn small btn-success">Approve</button>
                                </form>

                                <form method="POST" action="application_list.php" class="inline-form">
                                    <input type="hidden" name="update_status" value="1">
                                    <input type="hidden" name="application_id" value="<?php echo $app['application_id']; ?>">
                                    <input type="hidden" name="status" value="Rejected">
                                    <button type="submit" class="btn small btn-danger">Reject</button>
                                </form>

                            <?php else: ?>
                                <span class="action-done">Decision Made</span>
                            <?php endif; ?>
                        </td>
                    </tr>
                    <?php endforeach; ?>
                </tbody>
            </table>
        </div>
    <?php endif; ?>
</div>

</body>
</html>
